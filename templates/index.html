<!DOCTYPE html>
<html>
<head>
    <title>DevOps Task Manager</title>
</head>
<body>

    <h1>DevOps Task Manager</h1>

    <form method="POST">
        <label>Enter Task:</label>
        <input type="text" name="task" placeholder="Enter your task" required>
        <button type="submit">Add Task</button>
    </form>

    <h2>My Tasks</h2>

    <ul>
        {% for task in tasks %}
            <li>{{ task[1] }}</li>
        {% endfor %}
    </ul>

</body>
</html>
